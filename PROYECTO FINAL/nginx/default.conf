server {
    listen 80;
    server_name localhost;

    # Raíz apunta a /public de Laravel, no a la raíz del proyecto
    root /var/www/html/public;
    index index.php;

    # Redirige todo a index.php para que el router de Laravel funcione
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pasa los archivos .php al contenedor php (puerto 9000 de PHP-FPM)
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Bloquea el acceso a archivos ocultos como .env
    location ~ /\. {
        deny all;
    }
}
