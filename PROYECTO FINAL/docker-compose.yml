# =============================================================
# docker-compose.yml — Pensión La Herradura
# Documentación: https://docs.docker.com/compose/
# Versión del formato: Compose Specification (sin "version:" obsoleto)
# =============================================================

services:

  # -------------------------------------------------------
  # NGINX — Servidor web
  # Imagen oficial: https://hub.docker.com/_/nginx
  # -------------------------------------------------------
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"            # http://localhost:8080
    volumes:
      - ./src:/var/www/html                            
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - herradura_net
    restart: unless-stopped

  # -------------------------------------------------------
  # PHP-FPM — Backend Laravel 13
  # Dockerfile personalizado en ./php/Dockerfile
  # Documentación PHP-FPM: https://www.php.net/manual/es/install.fpm.php
  # -------------------------------------------------------
  php:
    build: ./php
    volumes:
      - ./src:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy   # Espera a que PostgreSQL esté listo
    networks:
      - herradura_net
    restart: unless-stopped

  # -------------------------------------------------------
  # POSTGRESQL 18 — Base de datos
  # Imagen oficial: https://hub.docker.com/_/postgres
  #             apunta a /var/lib/postgresql/data
  # -------------------------------------------------------
  postgres:
    image: postgres:17-alpine        
    environment:
      POSTGRES_DB: hotel_db
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: hotel_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data   
    ports:
      - "5432:5432"                  # Acceso desde Postman
    healthcheck:
      # Espera a que PostgreSQL acepte conexiones antes de arrancar PHP
      test: ["CMD-SHELL", "pg_isready -U hotel_user -d hotel_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - herradura_net
    restart: unless-stopped

  # -------------------------------------------------------
  # PGADMIN 4 — Interfaz gráfica para PostgreSQL
  # Imagen oficial: https://hub.docker.com/r/dpage/pgadmin4
  # Acceso: http://localhost:8081  |  admin@admin.com / admin
  # -------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    depends_on:
      - postgres
    networks:
      - herradura_net
    restart: unless-stopped

# =============================================================
# VOLÚMENES — Persistencia de datos entre reinicios
# Documentación: https://docs.docker.com/storage/volumes/
# =============================================================
volumes:
  postgres_data:

# =============================================================
# REDES — Red interna para comunicación entre contenedores
# Documentación: https://docs.docker.com/network/
# =============================================================
networks:
  herradura_net:
    driver: bridge
